name: Build APK

# WHY this workflow exists: producing an APK needs a JDK, the Android SDK, aapt2, R8 and
# every Maven dependency. Nobody reviewing this repository should have to install all of
# that to hold the app in their hand, and a runner has it already. The APK is published as
# a build artifact, downloadable from the run page with no toolchain at all.
#
# WHY workflow_dispatch is listed first: the primary use is "build me an APK now", on
# demand, not only as a side effect of a push.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# WHY cancel in progress: two pushes in quick succession make the first run's APK stale
# before it finishes, and an R8 + kapt build is minutes of runner time.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# WHY pinned: this workflow only builds and uploads artifacts. It never needs to write to
# the repository, and an explicit read-only default means a compromised dependency cannot
# push to the branch it ran on.
permissions:
  contents: read

jobs:
  # WHY the APK build and the unit tests are separate jobs, not steps in one: this codebase
  # has never been compiled, so the first runs are as likely to fail as to pass. Keeping
  # them independent means a red test job still leaves a downloadable APK, and a compile
  # error in the *test* sources cannot hide whether the app itself builds.
  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WHY 17 and not the runner default: app/build.gradle.kts pins sourceCompatibility,
      # targetCompatibility and jvmTarget to 17, and AGP 8.2.0 refuses to run on JDK 11.
      # ubuntu-latest ships several JDKs, so relying on whichever is default makes the
      # build depend on a runner-image update nobody reviews.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # WHY setup-gradle: it caches the Gradle distribution and the resolved dependency
      # graph between runs. A cold build of this project downloads Compose, Room, Retrofit,
      # OkHttp and the Android Gradle Plugin, which is most of the wall-clock time.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # WHY no Android SDK step: the ubuntu-latest image ships the SDK with ANDROID_HOME
      # set, licenses accepted, and platform 34 - which is this project's compileSdk. This
      # step prints what it found so that if a future image drops API 34, the failure says
      # "platform 34 missing" in the log instead of presenting as a mystery. The fix then
      # is to add `android-actions/setup-android@v3` above.
      - name: Record the Android SDK the runner provides
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || echo "no platforms directory"
          java -version

      # WHY no chmod: gradlew is committed at mode 100755, so it is already executable
      # after checkout. Adding `chmod +x` would paper over a lost mode bit instead of
      # surfacing it.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # WHY decode a base64 secret instead of committing a keystore: a keystore in the
      # repository means anyone who clones it can publish an update to this app under the
      # same signature. Base64 in a secret, decoded to $RUNNER_TEMP (outside the checkout,
      # so no artifact glob can pick it up), is the standard shape.
      #
      # WHY this step succeeds when there is no secret: an unsigned release APK is still
      # useful - it is what you measure for size, dex count and resource shrinking. Failing
      # the whole run because signing is not configured yet would withhold the debug APK
      # too, which is the one that actually installs.
      - name: Decode the release keystore, if one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.FOREX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No FOREX_KEYSTORE_BASE64 secret - the release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "FOREX_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded to \$RUNNER_TEMP."

      # WHY FOREX_STORE_FILE is not set here: the step above exports it through
      # $GITHUB_ENV, and repeating it as an empty secret would override the real path.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          FOREX_STORE_PASSWORD: ${{ secrets.FOREX_STORE_PASSWORD }}
          FOREX_KEY_ALIAS: ${{ secrets.FOREX_KEY_ALIAS }}
          FOREX_KEY_PASSWORD: ${{ secrets.FOREX_KEY_PASSWORD }}

      # WHY a loud warning rather than a quietly named file: AGP calls the two outputs
      # app-release.apk and app-release-unsigned.apk, and only one of those installs.
      # Someone who downloads the wrong one gets "app not installed" on their phone with
      # no idea why, so the run says it on the summary page and as an annotation.
      - name: Warn if the release APK is unsigned
        run: |
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::warning title=Unsigned release APK::app-release-unsigned.apk cannot be installed on a device. Add FOREX_KEYSTORE_BASE64, FOREX_STORE_PASSWORD, FOREX_KEY_ALIAS and FOREX_KEY_PASSWORD as repository secrets to get a signed app-release.apk, or install the debug APK instead."
          fi

      - name: Write the run summary
        run: |
          {
            echo "### APKs"
            echo
            find app/build/outputs/apk -name '*.apk' -printf '- `%p` — %s bytes\n' | sort
            echo
            echo "**Debug** is signed with the throwaway debug keystore and installs on any"
            echo "device with sideloading enabled. **Release** is R8-minified and installs"
            echo "only if the keystore secrets are configured; otherwise it is unsigned."
            echo
            echo "Download them from **Artifacts** at the bottom of this run page."
          } >> "$GITHUB_STEP_SUMMARY"

      # WHY if-no-files-found: error - silently uploading nothing is the worst outcome of
      # this workflow, because the whole point is the file. A run that produced no APK must
      # be red.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ForexAnalyst-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # WHY keep the R8 mapping: release builds are minified and obfuscated, so a crash
      # stack trace from the field is unreadable without mapping.txt, and it only works for
      # the exact build that produced it. This is the artifact you need the day a release
      # crashes and you have already lost the local build directory.
      - name: Upload the R8 mapping
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ForexAnalyst-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # WHY upload the Room schemas: app/build.gradle.kts sets room.schemaLocation to
      # app/schemas, and the exported JSON only exists after a real build. README and
      # docs/testing/IntegrationTests.md both record that MIGRATION_1_2 cannot be tested
      # without those files - this hands them to whoever wants to commit them and switch on
      # MigrationTestHelper. warn rather than error, because a first run may not export one.
      - name: Upload the exported Room schemas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ForexAnalyst-room-schemas
          path: app/schemas/
          if-no-files-found: warn

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # WHY only the JVM suites: 367 of the 394 tests are plain JUnit on the JVM (providers,
      # budgets, sanitising, chart maths, alert evaluation). The 27 in
      # ForexRepositoryIntegrationTest need a device or emulator, and GitHub-hosted runners
      # have no hardware acceleration - a software emulator takes ten minutes to boot and
      # fails intermittently for reasons unrelated to this code. That suite stays a local
      # `connectedDebugAndroidTest` run until a self-hosted or KVM-enabled runner exists.
      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # WHY upload on any outcome: an HTML report is how you find out *which* assertion
      # failed without re-running anything, and `if: failure()` alone would skip it when the
      # failure happens in an earlier step.
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
