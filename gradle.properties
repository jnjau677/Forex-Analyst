android.useAndroidX=true

# WHY Jetifier is gone: it rewrites pre-AndroidX support-library references at build
# time, and every dependency in this project is already AndroidX. It had nothing to do
# and cost a pass over the whole dependency graph on every configuration.

# WHY an explicit heap: this build runs kapt (Room's annotation processor) and R8 in the
# same JVM. Gradle's default maximum heap is small enough that `assembleRelease` can die
# with "GC overhead limit exceeded" or "Expiring Daemon because JVM heap space is
# exhausted" on an otherwise healthy machine - which reads exactly like a code error and
# is not one. 3g leaves room for R8's whole-program graph on a 7 GB CI runner.
#
# WHY -Dfile.encoding=UTF-8: the sources contain real non-ASCII characters (the em dash
# in PriceFormatter.NOT_A_NUMBER, arrows in KDoc). On a runner whose default charset is
# not UTF-8, javac emits "unmappable character" warnings and, in the worst case, mangles
# a user-visible string. Pinning the encoding makes the build machine-independent.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# --------------------------------------------------------------------------------------
# WHY there is no `android.aapt2FromMavenOverride` in this file
#
# It used to be here, pointing at /usr/bin/aapt2. That path exists only inside AndroidIDE
# (the on-device IDE this project was first built with); AGP otherwise downloads its own
# aapt2 from Maven. A *project-level* Gradle property is read by every machine that opens
# this repository, so any build outside AndroidIDE - Android Studio, the command line, CI -
# dies during resource linking with "Cannot run program /usr/bin/aapt2 ... No such file or
# directory", before Gradle ever reaches a line of Kotlin. One developer's environment does
# not get to be a build requirement for everyone else.
#
# If you build with AndroidIDE, put the override in your *user-level* properties file
# (~/.gradle/gradle.properties), where it applies to your machine only:
#
#     android.aapt2FromMavenOverride=/usr/bin/aapt2
# --------------------------------------------------------------------------------------
